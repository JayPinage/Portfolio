<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#07090D" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#cyberGrad)" stroke-width="2" opacity="0.6" />
  <!-- Stylized JP / AI Node Core -->
  <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="none" stroke="url(#cyberGrad)" stroke-width="4" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="12" fill="#00E5FF" filter="url(#glow)" />
  <line x1="50" y1="18" x2="50" y2="38" stroke="#00E5FF" stroke-width="2.5" />
  <line x1="50" y1="62" x2="50" y2="82" stroke="#8B5CF6" stroke-width="2.5" />
  <line x1="22" y1="34" x2="40" y2="44" stroke="#00E5FF" stroke-width="2.5" />
  <line x1="78" y1="66" x2="60" y2="56" stroke="#8B5CF6" stroke-width="2.5" />
</svg>